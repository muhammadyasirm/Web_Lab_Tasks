<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Instagram</title>
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <div class="page">
      <!-- LEFT HERO PANEL -->
      <div class="hero-panel">
        <div class="hero-content">
          <svg class="ig-icon" viewBox="0 0 24 24">
            <defs>
              <linearGradient id="igGrad" x1="0%" y1="100%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#ffdb8c" />
                <stop offset="30%" stop-color="#ff5a3c" />
                <stop offset="60%" stop-color="#ff2d75" />
                <stop offset="100%" stop-color="#c92fd8" />
              </linearGradient>
            </defs>
            <path
              fill="url(#igGrad)"
              d="M12 2.16c3.2 0 3.58.01 4.85.07 3.25.15 4.77 1.69 4.92 4.92.06 1.27.07 1.65.07 4.85s-.01 3.58-.07 4.85c-.15 3.23-1.66 4.77-4.92 4.92-1.27.06-1.64.07-4.85.07s-3.58-.01-4.85-.07c-3.26-.15-4.77-1.7-4.92-4.92-.06-1.27-.07-1.65-.07-4.85s.02-3.58.07-4.85c.15-3.23 1.66-4.77 4.92-4.92 1.27-.06 1.65-.07 4.85-.07zM12 0C8.74 0 8.33.01 7.05.07c-4.35.2-6.78 2.62-6.98 6.98C.01 8.33 0 8.74 0 12s.01 3.67.07 4.95c.2 4.36 2.62 6.78 6.98 6.98C8.33 23.99 8.74 24 12 24s3.67-.01 4.95-.07c4.35-.2 6.78-2.62 6.98-6.98.06-1.28.07-1.69.07-4.95s-.01-3.67-.07-4.95c-.2-4.35-2.62-6.78-6.98-6.98C15.67.01 15.26 0 12 0zm0 5.84A6.16 6.16 0 1 0 18.16 12 6.16 6.16 0 0 0 12 5.84zM12 16a4 4 0 1 1 4-4 4 4 0 0 1-4 4zm6.41-10.85a1.44 1.44 0 1 0 1.44 1.44 1.44 1.44 0 0 0-1.44-1.44z"
            />
          </svg>

          <h1 class="hero-text">
            See everyday moments from your<br />
            <span class="gradient-text">close friends.</span>
          </h1>

          <div class="collage">
            <div
              class="story-card card1"
              style="
                background-image: url(&quot;https://picsum.photos/seed/ig1/200/320&quot;);
              "
            ></div>

            <div
              class="story-card card2"
              style="
                background-image: url(&quot;https://picsum.photos/seed/ig2/200/320&quot;);
              "
            >
              <div class="story-progress"></div>
            </div>
            <div class="reaction-bubble">🥰🤩</div>
            <div class="star-badge">★ ✓</div>
            <div class="heart-float">
              <svg viewBox="0 0 24 24">
                <path
                  d="M12 21s-6.7-4.35-9.33-8.2C.6 9.77 1.4 6.4 4.2 5.1c2.1-.97 4.3-.2 5.8 1.6 1.5-1.8 3.7-2.57 5.8-1.6 2.8 1.3 3.6 4.67 1.53 7.7C18.7 16.65 12 21 12 21z"
                />
              </svg>
            </div>

            <div
              class="story-card card3"
              style="
                background-image: url(&quot;https://picsum.photos/seed/ig3/200/320&quot;);
              "
            ></div>

            <div class="avatar-ring">
              <img src="https://picsum.photos/seed/igavatar/100/100" alt="" />
            </div>

            <div class="bottom-icons">
              <span
                ><svg viewBox="0 0 24 24">
                  <path
                    d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5c-1.3 0-2.5-.3-3.6-.8L3 20l1.2-4.5A8.5 8.5 0 1 1 21 11.5z"
                  /></svg
              ></span>
              <span
                ><svg viewBox="0 0 24 24">
                  <path
                    d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 1 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"
                  /></svg
              ></span>
            </div>
          </div>
        </div>
      </div>

      <!-- RIGHT LOGIN PANEL -->
      <div class="login-panel">
        <div class="login-form-wrap">
          <h2>Log into Instagram</h2>

          <form onsubmit="return false;">
            <input
              type="text"
              placeholder="Mobile number, username or email"
              required
            />
            <input type="password" placeholder="Password" required />
            <button type="submit" class="login-btn">Log in</button>
          </form>

          <a href="#" class="forgot">Forgot password?</a>

          <div class="gap-space"></div>

          <button type="button" class="fb-btn">
            <svg viewBox="0 0 24 24" fill="#1877F2">
              <path
                d="M22 12.06C22 6.5 17.52 2 12 2S2 6.5 2 12.06c0 5 3.66 9.15 8.44 9.94v-7.03H7.9v-2.91h2.54V9.85c0-2.5 1.49-3.89 3.77-3.89 1.09 0 2.23.2 2.23.2v2.46h-1.26c-1.24 0-1.63.77-1.63 1.56v1.88h2.78l-.45 2.91h-2.33V22c4.78-.79 8.44-4.94 8.44-9.94z"
              />
            </svg>
            Log in with Facebook
          </button>

          <button type="button" class="create-btn">Create new account</button>

          <div class="meta-logo">
            <span class="infinity">∞</span>
            Meta
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
